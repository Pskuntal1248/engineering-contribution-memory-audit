contract: v1
name: engineering-contribution-memory
version: 0.1.3
description: Reads the last 6 months of your GitHub, Jira, Slack and docs and keeps an evidence-linked engineering profile. It links shipped work into projects, shows invisible work like reviews and on-call, evidences gaps against your career ladder, and gives weekly summaries, 1:1 points, review material and interview stories on demand from the saved profile. A Friday 5 PM IST run (changeable) adds the week's new items; the timezone input sets report dates.
kind: monitor

runtime:
  framework: langgraph
  python: "3.12"
  entrypoint: src/agent.py:graph
  timeout_seconds: 1800

dependencies:
  lockfile: requirements.lock

inputs:
  - name: github_username
    type: text
    label: "Your GitHub username (optional: read from your connected GitHub account when blank)"
    required: false
  - name: repos_or_org
    type: textarea
    label: "Repos to read (owner/repo, comma separated)"
    required: true
  - name: jira_site
    type: url
    label: "Jira site URL (optional: read from your connected Jira when blank)"
    required: false
  - name: jira_projects
    type: textarea
    label: "Jira project keys, comma separated"
    required: true
  - name: slack_channels
    type: textarea
    label: "Slack channels to read (public or ones you opt in), comma separated"
    required: true
  - name: include_dms
    type: static-dropdown
    label: "Include DMs? (default No). With Yes, only the DMs you list in the channels box are read (a person's Slack user ID), or write *dm* to opt in to all. Private channels are read only when you list them"
    options: ["No", "Yes"]
    default: "No"
    required: false
  - name: display_name
    type: text
    label: "Your name as it appears in Jira, Slack and docs (optional: taken from GitHub when blank)"
    required: false
  - name: slack_user_ids
    type: text
    label: "Your Slack user ID(s), comma separated"
    required: false
  - name: docs_source
    type: static-dropdown
    label: "Docs source (pick the ones you use; each must be connected)"
    options: ["None", "Confluence", "Notion", "Google Drive", "Confluence + Notion", "Confluence + Google Drive", "Notion + Google Drive", "All three"]
    default: "None"
    required: false
  - name: backfill_months
    type: number
    label: "Months to backfill on the first run"
    default: 6
    required: false
  - name: role_and_level
    type: text
    label: "Your role and level (e.g. Software Engineer II, Payments)"
    required: true
  - name: review_framework
    type: textarea
    label: "Career ladder / review framework text (optional; enables evidence gaps)"
    required: false
  - name: team_changes
    type: textarea
    label: "Team changes in the period (optional), one per line: YYYY-MM-DD: Team name"
    required: false
  - name: request
    type: static-dropdown
    label: "What to produce (weekly_update = first run backfills, then new items each week; the scheduled run uses this)"
    options: ["weekly_update", "weekly_summary", "one_on_one", "review_material", "interview_stories", "evidence_gaps"]
    default: "weekly_update"
    required: false
  - name: period_from
    type: date
    label: "Review material: from (the two dates decide the period)"
    required: false
  - name: period_to
    type: date
    label: "Review material: to"
    required: false
  - name: redact_terms
    type: textarea
    label: "Customer or internal names to strip from interview stories, comma separated"
    required: false
  - name: keep_internal_details
    type: static-dropdown
    label: "Keep internal names and figures in interview stories?"
    options: ["No", "Yes"]
    default: "No"
    required: false
  - name: timezone
    type: static-dropdown
    label: "Your timezone"
    options: ["Asia/Kolkata", "UTC", "Europe/London", "Europe/Berlin", "America/New_York", "America/Chicago", "America/Los_Angeles", "Asia/Singapore", "Asia/Tokyo", "Australia/Sydney"]
    default: "Asia/Kolkata"
    required: false

permissions:
  tools:
    - github.search_issues
    - github.get_the_authenticated_user
    - github.list_pull_requests
    - github.list_pr_files
    - github.list_pr_reviews
    - github.list_commits
    - github.get_commit
    - github.list_commits_on_a_pull_request
    - github.list_organization_repositories
    - github.list_repositories_for_a_user
    - jira.search_issues
    - jira.get_all_projects
    - jira.get_server_info
    - jira.get_issue
    - jira.list_issue_comments
    - confluence.cql_search
    - confluence.get_page_by_id
    - confluence.get_pages
    - confluence.get_current_user
    - confluence.get_labels_for_page
    - confluence.who_am_i
    - confluence.get_spaces
    - confluence.search_pages
    - notion.search_notion_page
    - notion.get_page_markdown
    - notion.list_users
    - drive.find_file
    - drive.get_document
    - drive.get_about
    - drive.list_revisions
    - slack.search_messages
    - slack.fetch_message_thread_from_a_conversation
    - slack.list_channels
    - slack.read_history
  models:
    tier: standard

triggers:
  manual: true
  schedule:
    cron: "0 17 * * 5"
    consumer_can_change: true

state:
  max_kb: 256

outputs:
  profile: {renderer: markdown, label: "Profile / report", destinations: [download]}
  ledger: {renderer: rows, label: "Item ledger (CSV)"}


