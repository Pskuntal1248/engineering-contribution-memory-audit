contract: v1
name: engineering-contribution-memory
version: 0.1.4
description: Start with GitHub to build an evidence-linked engineering profile from your last 6 months of work. Jira, Slack and docs are optional. See shipped work, reviews and gaps against your career ladder, then request weekly summaries, 1:1 points, review material and interview stories from the saved profile. The weekly run is Friday 17:00 IST; timezone sets report dates. Coverage and incomplete reads are shown.
kind: monitor

runtime:
  framework: langgraph
  python: "3.12"
  entrypoint: src/agent.py:graph
  timeout_seconds: 1800

dependencies:
  lockfile: requirements.lock

inputs:
  - name: github_username
    type: text
    label: "Your GitHub username (optional: read from your connected GitHub account when blank)"
    required: false
  - name: role_and_level
    type: text
    label: "Your role and level (e.g. Software Engineer II, Payments)"
    required: true
  - name: request
    type: static-dropdown
    label: "What to produce (weekly_update = initial backfill, then incremental; setup edits save only, enrich_new_scopes reads new selections separately)"
    options: ["update_source_setup", "enrich_new_scopes", "weekly_update", "weekly_summary", "one_on_one", "review_material", "interview_stories", "evidence_gaps"]
    default: "weekly_update"
    required: false
  - name: repos_or_org
    type: textarea
    label: "Repos to read (required: owner/repo, comma or newline separated; multiple allowed)"
    required: true
  - name: setup_revision
    type: text
    label: "Advanced: Current source setup revision (required only to replace existing setup; blank/None sources disable them on that action)"
    required: false
  - name: jira_site
    type: url
    label: "Advanced: Jira site URL (optional: read from your connected Jira when blank)"
    required: false
  - name: jira_projects
    type: textarea
    label: "Advanced: Jira project keys, comma separated"
    required: false
  - name: slack_channels
    type: textarea
    label: "Advanced: Slack channels to read (public or ones you opt in), comma separated"
    required: false
  - name: include_dms
    type: static-dropdown
    label: "Advanced: Include DMs? No by default. With Yes, name each DM recipient or channel ID in Slack channels. Private channels must also be named."
    options: ["No", "Yes"]
    default: "No"
    required: false
  - name: display_name
    type: text
    label: "Advanced: Your name as it appears in Jira, Slack and docs (optional: taken from GitHub when blank)"
    required: false
  - name: slack_user_ids
    type: text
    label: "Advanced: Your Slack user ID(s), comma separated"
    required: false
  - name: docs_source
    type: static-dropdown
    label: "Advanced: Docs source (pick the ones you use; each must be connected)"
    options: ["None", "Confluence", "Notion", "Google Drive", "Confluence + Notion", "Confluence + Google Drive", "Notion + Google Drive", "All three"]
    default: "None"
    required: false
  - name: backfill_months
    type: number
    label: "Advanced: Months to backfill on the first run"
    default: 6
    required: false
  - name: review_framework
    type: textarea
    label: "Advanced: Career ladder / review framework text (optional; enables evidence gaps)"
    required: false
  - name: team_changes
    type: textarea
    label: "Advanced: Team changes in the period (optional), one per line: YYYY-MM-DD: Team name"
    required: false
  - name: period_from
    type: date
    label: "Advanced: Review material: from (the two dates decide the period)"
    required: false
  - name: period_to
    type: date
    label: "Advanced: Review material: to"
    required: false
  - name: redact_terms
    type: textarea
    label: "Advanced: Customer or internal names to strip from interview stories, comma separated"
    required: false
  - name: keep_internal_details
    type: static-dropdown
    label: "Advanced: Keep internal names and figures in interview stories?"
    options: ["No", "Yes"]
    default: "No"
    required: false
  - name: timezone
    type: static-dropdown
    label: "Advanced: Your timezone, used for date ranges only; schedules run in IST"
    options: ["Asia/Kolkata", "UTC", "Europe/London", "Europe/Berlin", "America/New_York", "America/Chicago", "America/Los_Angeles", "Asia/Singapore", "Asia/Tokyo", "Australia/Sydney"]
    default: "Asia/Kolkata"
    required: false
  - name: exclude_repos
    type: textarea
    label: "Advanced: Repos to exclude (owner/repo, comma separated)"
    required: false

permissions:
  tools:
    - github.search_issues
    - github.get_the_authenticated_user
    - github.list_pull_requests
    - github.list_pr_files
    - github.list_pr_reviews
    - github.list_commits
    - github.list_branches
    - github.get_commit
    - github.list_commits_on_a_pull_request
    - jira.search_issues
    - jira.get_all_projects
    - jira.get_server_info
    - jira.get_issue
    - jira.list_issue_comments
    - confluence.cql_search
    - confluence.get_page_by_id
    - confluence.get_pages
    - confluence.get_current_user
    - confluence.get_labels_for_page
    - confluence.who_am_i
    - confluence.get_spaces
    - confluence.search_pages
    - notion.search_notion_page
    - notion.get_page_markdown
    - notion.list_users
    - drive.find_file
    - drive.get_document
    - drive.get_about
    - drive.list_revisions
    - slack.search_messages
    - slack.fetch_message_thread_from_a_conversation
    - slack.list_channels
    - slack.read_history
  models:
    tier: standard

triggers:
  manual: true
  schedule:
    cron: "0 17 * * 5"
    consumer_can_change: true

state:
  max_kb: 256

outputs:
  profile: {renderer: markdown, label: "Profile / report", destinations: [download]}
  ledger: {renderer: rows, label: "Item ledger (CSV)"}
